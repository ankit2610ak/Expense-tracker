# Netlify Configuration for Expense Tracker Frontend
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Proxy API requests if your backend server is deployed on Railway, Render, or Fly.io
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service.com/api/:splat"
#   status = 200
#   force = true

