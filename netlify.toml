# Netlify Configuration for Expense Tracker
[build]
  command = "cd frontend && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "frontend/netlify/functions"
  node_bundler = "esbuild"

# SPA fallback for client-side routing
# Custom function routes with config.path (/api/*) and static assets are matched before this fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
