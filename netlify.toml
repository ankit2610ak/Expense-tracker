# Netlify Configuration for Expense Tracker
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback for client-side routing
# Functions with config.path (/api/*) and static assets are matched before this fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
